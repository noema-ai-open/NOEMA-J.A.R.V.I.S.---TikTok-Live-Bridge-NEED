name: Windows installer and ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install ".[build,dev]"
      - name: Python tests
        run: python -m pytest -q
      - name: Player and capture-guard tests
        run: node --test tests/test_youtube_player.cjs tests/test_chat_music_guard.cjs
      - name: Build application
        run: python -m PyInstaller --noconfirm NOEMA-JARVIS.spec
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          ./scripts/build-installer.ps1 -Version 0.5.4 -Compiler $compiler
      - name: Clean install smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-setup/NOEMA-JARVIS-Setup-0.5.4.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE fehlt." }
          $target = Join-Path $env:RUNNER_TEMP "noema-jarvis-clean"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $install = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer ExitCode $($install.ExitCode)" }
          $exe = Join-Path $target "dist\NOEMA-JARVIS.exe"
          if (!(Test-Path $exe)) { throw "Installierte EXE fehlt: $exe" }
          $proc = Start-Process $exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8770/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Installierte Anwendung wurde nicht gesund." }
            $dashboard = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8770/" -TimeoutSec 3
            if ($dashboard.StatusCode -ne 200 -or $dashboard.Content -notmatch "chat-music-guard.js") {
              throw "Dashboard oder Capture-Guard fehlt."
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Package complete portable distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release, package | Out-Null
          git archive --format=zip HEAD -o source.zip
          Expand-Archive source.zip package
          New-Item -ItemType Directory -Force package/dist | Out-Null
          Copy-Item dist/NOEMA-JARVIS.exe package/dist/
          Copy-Item dist-setup/*.exe release/
          Compress-Archive -Path package/*,package/.env.example,package/.gitignore -DestinationPath release/NOEMA-JARVIS-Komplett-0.5.4.zip
          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256.txt
      - name: Publish downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-0.5.4-${{ github.run_number }}"
          gh release create $tag release/* --target "${{ github.sha }}" --title "JARVIS 0.5.4 Windows Setup" --notes "Setup-EXE mit Desktop-Verknuepfung und vollstaendiges portables ZIP. TikTok-Musikwünsche laufen im Hintergrund ohne sichtbares Medienfenster und werden nicht an die AI-Queue weitergereicht. Transiente LLM-Fehler pausieren die Verarbeitung nicht dauerhaft. Python ist nicht erforderlich. Die NOEMA TikTok Live Bridge laeuft separat. Eigene Zugangsdaten in den Einstellungen eintragen."
