[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noema-live-ai-bridge"
version = "0.5.9"
description = "Local AI/Jarvis companion for NOEMA TikTok Live Bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
